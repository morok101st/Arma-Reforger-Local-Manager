# Baut bei einem Tag wie v0.5.0 das Paket und veröffentlicht es. Versionen unter 1.0 erscheinen als Vorabversion.
# Actions sind per Commit-SHA eingebunden, damit ein verschobener Tag nichts Fremdes ausführt.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Tests und Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Bekannte Sicherheitslücken in Abhängigkeiten
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Paket bauen
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & scripts\build-package.ps1 -Version $version

      - name: Release veröffentlichen
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-Item publish\*.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = "$($zip.FullName).sha256"
          [IO.File]::WriteAllText($hashFile, "$hash  $($zip.Name)`n")
          $notes = "Installation: ZIP nach %LOCALAPPDATA%\Programs\ReforgerSyncLaunch entpacken und ReforgerSyncLaunch.exe starten. Einstellungen und Passwörter früherer Versionen bleiben erhalten. Alles Weitere steht in LIES-MICH.txt im Paket. Voraussetzungen: Windows 10 oder 11 (64 Bit), WebView2, Steam und Arma Reforger.`n`nSHA-256 von $($zip.Name):`n``$hash``"
          $prerelease = if ($tag -match '^v0\.') { @('--prerelease') } else { @() }
          & gh release create $tag $zip.FullName $hashFile --verify-tag @prerelease --title "Reforger Sync & Launch $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht erstellt werden' }
