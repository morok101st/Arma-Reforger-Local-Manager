# Baut bei einem Tag wie v0.5.0 Installer, Update-Beschreibung und ZIP und veröffentlicht sie.
# Kein Vorabversion-Kennzeichen: Die installierten Apps finden Updates über releases/latest, und das zeigt nur
# reguläre Releases. Der Signaturschlüssel kommt aus dem Secret TAURI_SIGNING_PRIVATE_KEY.
# Actions sind per Commit-SHA eingebunden, damit ein verschobener Tag nichts Fremdes ausführt.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Tests und Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Bekannte Sicherheitslücken in Abhängigkeiten
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Paket bauen
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Secret TAURI_SIGNING_PRIVATE_KEY fehlt' }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & scripts\build-package.ps1 -Version $version

      - name: Release veröffentlichen
        # PowerShell 7 liest das Skript als UTF-8. Windows PowerShell 5.1 würde die Umlaute der Notizen verstümmeln.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = Get-Item publish\*-Setup.exe
          $zip = Get-Item publish\*.zip
          $latest = Get-Item publish\latest.json
          $hashes = foreach ($file in $setup, $zip) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          }
          $hashFile = Join-Path publish 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($hashFile, ($hashes -join "`n") + "`n")
          $fence = '```'
          $notes = "Installation: $($setup.Name) herunterladen und starten. Die App landet in %LOCALAPPDATA%\Programs\ReforgerSyncLaunch, ohne Administratorrechte, und meldet künftige Updates selbst. Eine bisher entpackte Version im selben Ordner wird ersetzt. Einstellungen, Passwörter und Mods bleiben erhalten.`n`nOhne Installation: $($zip.Name) entpacken. Diese Variante aktualisiert sich nicht selbst.`n`nVoraussetzungen: Windows 10 oder 11 (64 Bit), WebView2, Steam und Arma Reforger.`n`nSHA-256:`n$fence`n$($hashes -join "`n")`n$fence"
          & gh release create $tag $setup.FullName $zip.FullName $latest.FullName $hashFile --verify-tag --title "Reforger Sync & Launch $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht erstellt werden' }
