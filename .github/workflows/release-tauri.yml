# Baut bei einem Tag wie tauri-v0.1.0 das Paket der Tauri-Vorschau und veröffentlicht es als Vorabversion.
# Eigenes Tag-Präfix, damit der Release-Workflow der WPF-App (v*) nicht anspringt.
# Actions sind per Commit-SHA eingebunden, damit ein verschobener Tag nichts Fremdes ausführt.
name: Release Tauri-Vorschau

on:
  push:
    tags:
      - 'tauri-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/app/package-lock.json

      - name: Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Tests und Clippy
        working-directory: tauri
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Bekannte Sicherheitslücken in Abhängigkeiten
        working-directory: tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Paket bauen
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.Substring('tauri-v'.Length)
          & scripts\build-tauri-package.ps1 -Version $version

      - name: Release veröffentlichen
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-Item publish\tauri\*.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = "$($zip.FullName).sha256"
          [IO.File]::WriteAllText($hashFile, "$hash  $($zip.Name)`n")
          $notes = "Vorschau mit Rust und Tauri, parallel zur bisherigen App nutzbar (gemeinsame Einstellungen). Installation: ZIP nach %LOCALAPPDATA%\Programs\ReforgerSyncLaunchTauri entpacken und ReforgerSyncLaunch-Tauri.exe starten. Alles Weitere steht in LIES-MICH.txt im Paket. Voraussetzungen: Windows 10 oder 11 (64 Bit), WebView2, Steam und Arma Reforger.`n`nSHA-256 von $($zip.Name):`n``$hash``"
          & gh release create $tag $zip.FullName $hashFile --verify-tag --prerelease --title "Reforger Sync & Launch $tag (Vorschau)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release konnte nicht erstellt werden' }
