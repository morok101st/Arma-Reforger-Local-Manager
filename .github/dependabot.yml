# Schlägt Updates für die Actions im Release-Workflow und die Rust- und npm-Pakete vor, als Pull Request gegen dev.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /tauri
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tauri/app
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
