[workspace]
resolver = "3"
members = ["crates/rms-core", "crates/rms-cli", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false

# Kleine EXE: volle Optimierung, ein Codegen-Block, Symbole entfernen, bei Panic sofort beenden.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
