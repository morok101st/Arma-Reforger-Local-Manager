[package]
name = "reforger-sync-launch"
description = "Reforger Sync & Launch (Vorschau mit Tauri)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ReforgerSyncLaunch-Tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rms-core = { path = "../../crates/rms-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell"] }
