[package]
name = "rms-cli"
description = "Kommandozeile von Reforger Sync & Launch"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "reforger-sync-cli"
path = "src/main.rs"

[dependencies]
rms-core = { path = "../rms-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.20"
